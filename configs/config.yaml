device: auto

network:
  num_blocks: 10
  channels: 128

mcts:
  num_simulations: 160
  c_puct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  temp_init: 1.0
  temp_final: 0.0
  temp_decay_plies: 30

selfplay:
  games_per_generation: 25
  max_plies: 512

training:
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  train_steps_per_generation: 400
  replay_buffer_capacity: 100000

arena:
  max_games: 20  # arena count = min(self-play games per gen, max_games)
  win_rate_threshold: 0.55

benchmark:
  stockfish_path: /opt/homebrew/bin/stockfish
  time_limit_sec: 0.2
  agent_simulations: 160

paths:
  ledger_db: data/ledger.db
  checkpoints_dir: data/checkpoints
  replay_dir: data/replay
  pgns_dir: data/pgns
