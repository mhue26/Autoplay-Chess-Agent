# Tiny profile: fast debugging on CPU or MPS
profile: tiny
device: auto  # "mps", "cuda", "cpu", or "auto"

network:
  num_blocks: 6
  channels: 64

mcts:
  num_simulations: 64
  c_puct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  temp_init: 1.0
  temp_final: 0.0
  temp_decay_plies: 30
  virtual_loss: 3.0

selfplay:
  games_per_generation: 10
  max_plies: 200

training:
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  train_steps_per_generation: 100
  replay_buffer_capacity: 50000
  window_games: 100

arena:
  num_games: 10
  win_rate_threshold: 0.55
  temperature: 0.2

benchmark:
  stockfish_path: /opt/homebrew/bin/stockfish
  games_per_opponent: 10
  time_limit_sec: 0.1
  agent_simulations: 64

paths:
  data_dir: data
  ledger_db: data/ledger.db
  checkpoints_dir: data/checkpoints
  replay_dir: data/replay
  pgns_dir: data/pgns
