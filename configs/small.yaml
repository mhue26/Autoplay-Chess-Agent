# Small profile: recommended default for training on Apple Silicon (M-series)
profile: small
device: auto

network:
  num_blocks: 10
  channels: 128

mcts:
  num_simulations: 160
  c_puct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  temp_init: 1.0
  temp_final: 0.0
  temp_decay_plies: 30
  virtual_loss: 3.0

selfplay:
  games_per_generation: 25
  max_plies: 300

training:
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  train_steps_per_generation: 400
  replay_buffer_capacity: 100000
  window_games: 250

arena:
  num_games: 20
  win_rate_threshold: 0.55
  temperature: 0.2

benchmark:
  stockfish_path: /opt/homebrew/bin/stockfish
  games_per_opponent: 20
  time_limit_sec: 0.2
  agent_simulations: 160

paths:
  data_dir: data
  ledger_db: data/ledger.db
  checkpoints_dir: data/checkpoints
  replay_dir: data/replay
  pgns_dir: data/pgns
